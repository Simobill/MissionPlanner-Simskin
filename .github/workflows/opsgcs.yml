name: OpsGCS Windows Build

on:
  push:
    branches: [ "opsgcs/**", "main", "master" ]
    tags: [ "ops-v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OpsGCS (Release)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: OpsGCS unit tests
        shell: pwsh
        run: |
          dotnet test MissionPlannerTests/MissionPlannerTests.csproj --configuration Release --filter "FullyQualifiedName~MissionPlannerTests.OpsGCS" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          cd bin\Release\net461
          # drop example plugin sources so they are not compiled at runtime on operator machines
          gci plugins | Where-Object { -not $_.PSIsContainer } | Remove-Item
          if (-not (Test-Path custom.mpsystheme)) { throw "custom.mpsystheme missing from output" }
          if (-not (Test-Path opsgcs.json)) { throw "opsgcs.json missing from output" }
          if (-not (Test-Path opsgcs-web\index.html)) { throw "opsgcs-web missing from output" }
          if (-not (Test-Path Microsoft.Web.WebView2.WinForms.dll)) { throw "WebView2 assemblies missing from output" }
          $sha = "${{ github.sha }}".Substring(0,8)
          "OpsGCS $sha built $(Get-Date -Format o)" | Out-File -Encoding utf8 opsgcs-build.txt
          7z a -tzip "..\..\..\OpsGCS-$sha.zip" *
          cd ..\..\..
          Get-FileHash "OpsGCS-$sha.zip" -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 "OpsGCS-$sha.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: OpsGCS-${{ github.sha }}
          path: |
            OpsGCS-*.zip
            OpsGCS-*.sha256.txt

      - name: Release (tags ops-v*)
        if: startsWith(github.ref, 'refs/tags/ops-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            OpsGCS-*.zip
            OpsGCS-*.sha256.txt
